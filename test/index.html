<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OpenRPGLoader Test Runner</title>
</head>
<body>
    <h1>Running tests...</h1>
    <script>
        const fs = require('fs');
        const path = require('path');
        const testDir = path.resolve(process.cwd(), 'OpenRPGLoader', 'test');
        const logFile = path.join(testDir, 'test_results.log');
        const errFile = path.join(testDir, 'test_error.log');

        try {
            const runnerFile = path.join(testDir, 'test_runner.js');
            require(runnerFile);
        } catch (err) {
            fs.writeFileSync(errFile, String(err && err.stack ? err.stack : err), 'utf8');
        }

        setTimeout(() => {
            if (typeof nw !== 'undefined' && nw.App && nw.App.quit) {
                nw.App.quit();
            } else {
                window.close();
            }
        }, 1500);
    </script>
</body>
</html>

name: OpenRPGLoader CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Syntax Check Core Files
      run: |
        node -c src/OpenRPGEngine.js
        node -c src/OpenRPGLoader.js
        node -c examples/adapters/VanillaMZ_UIAdapter.js
        node -c examples/extensions/SampleCyberpunk_Extension.js
        node -c sample_mod/index.js

    - name: Run OpenRPGLoader Automated Test Suite
      run: node test/test_runner.js
